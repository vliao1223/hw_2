<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AttendanceChimp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }
      .bio {
        max-width: 600px;
        margin: 0 auto;
      }
      .username {
        font-weight: bold;
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="bio">
      <h1>AttendanceChimp</h1>
      <p>Electronic class attendance tracking application.</p>
      <hr />
      {% if username %}
      <p class="username">{{username}}</p>
      {% else %}
      <p>Not logged in.</p>
      {% endif %}

      <p>Time: {{ time }}</p>
    </div>
  </body>
</html>
