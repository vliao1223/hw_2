<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Course</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }
    </style>
  </head>
  <body>
    <h1>New Course</h1>

    <form action="/app/createCourse" method="post">
      {% csrf_token %}

      <div>
        <label for="course-name">Course name:</label>
        <input type="text" id="course-name" name="course-name" required />
      </div>

      <div>
        <label for="start-time">Start time:</label>
        <input type="time" id="start-time" name="start-time" required />
      </div>

      <div>
        <label for="end-time">End time:</label>
        <input type="time" id="end-time" name="end-time" required />
      </div>

      <div>
        <label>Meeting days:</label>
        <label>Monday</label>
        <input type="checkbox" id="day-mon" name="day-mon" value="1" />
        <label>Tuesday</label>
        <input type="checkbox" id="day-tue" name="day-tue" value="1" />
        <label>Wednesday</label>
        <input type="checkbox" id="day-wed" name="day-wed" value="1" />
        <label>Thursday</label>
        <input type="checkbox" id="day-thu" name="day-thu" value="1" />
        <label>Friday</label>
        <input type="checkbox" id="day-fri" name="day-fri" value="1" />
      </div>

      <button type="submit">Create Course</button>
    </form>
  </body>
</html>
