<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Up</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }
    </style>
  </head>
  <body>
    <h1>Upload QR Code</h1>
    <form action="/app/createQRCodeUpload" method="post">
      {% csrf_token %}

      <div>
        <label for="photo">QR code photo:</label>
        <input type="file" id="photo" name="photo" required />
      </div>

      <button type="submit">Upload</button>
    </form>
  </body>
</html>
